name: "CI: Test Python Bindings Installation"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, ready_for_review]

env:
  BUILD_TYPE: Release

jobs:
  # ── Build wheels once per OS, upload as artifacts ──────────────────────────
  build-wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push' || github.event.pull_request.draft == false

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"   # one version is enough to build the wheel

    # ── dependency caches ───────────────────────────────────────────────────

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: pip-${{ matrix.os }}-${{ hashFiles('**/setup.cfg', '**/pyproject.toml', '**/setup.py') }}
        restore-keys: pip-${{ matrix.os }}-

    - name: Cache CMake build directory
      uses: actions/cache@v4
      with:
        path: build/
        key: cmake-${{ matrix.os }}-${{ hashFiles('CMakeLists.txt', '**/*.cmake') }}
        restore-keys: cmake-${{ matrix.os }}-

    # Windows: cache vcpkg packages (the expensive part)
    - name: Cache vcpkg
      if: matrix.os == 'windows-latest'
      uses: actions/cache@v4
      with:
        path: |
          vcpkg/installed
          vcpkg/packages
          vcpkg/buildtrees
        key: vcpkg-${{ matrix.os }}-tbb-${{ hashFiles('vcpkg.json') }}
        restore-keys: vcpkg-${{ matrix.os }}-tbb-

    # ── system deps ─────────────────────────────────────────────────────────

    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update && sudo apt-get install -y cmake build-essential doxygen libtbb-dev

    - name: Install system dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: brew install cmake doxygen tbb

    - name: Install system dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
        choco install doxygen.install -y
        if (-not (Test-Path "vcpkg")) {
          git clone https://github.com/microsoft/vcpkg.git vcpkg
          .\vcpkg\bootstrap-vcpkg.bat
        }
        .\vcpkg\vcpkg install tbb:x64-windows
        echo "CMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake" >> $env:GITHUB_ENV
        echo "VCPKG_TARGET_TRIPLET=x64-windows" >> $env:GITHUB_ENV

    # ── build once ──────────────────────────────────────────────────────────

    - name: Build wheel
      run: |
        python -m pip install --upgrade pip build
        python -m build --wheel

    - name: Upload wheel artifact
      uses: actions/upload-artifact@v4
      with:
        name: wheel-${{ matrix.os }}
        path: dist/*.whl
        retention-days: 1

  # ── Test the pre-built wheel across Python versions ────────────────────────
  test-wheel:
    needs: build-wheel
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]   # 3.14 is pre-release; swap in when stable

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Download wheel
      uses: actions/download-artifact@v4
      with:
        name: wheel-${{ matrix.os }}
        path: dist/

    - name: Install from pre-built wheel
      run: python -m pip install dist/*.whl

    - name: Import test
      run: python -c "import dsf; print('DSF import successful')"

    - name: Attribute test
      run: |
        python -c "
        import dsf
        attrs = [a for a in dir(dsf) if not a.startswith('_')]
        print('Attributes:', attrs)
        print('Basic DSF functionality test passed')
        "

    - name: Verify package metadata
      run: |
        python -c "
        import importlib.metadata
        try:
            dist = importlib.metadata.distribution('dsf')
            print(f'{dist.name} {dist.version} @ {dist.locate_file(\"\")}')
        except importlib.metadata.PackageNotFoundError:
            print('Warning: package metadata not found')
        "

  # ── Lightweight dev checks (ubuntu only, no rebuild) ──────────────────────
  test-dev:
    needs: build-wheel
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Download wheel
      uses: actions/download-artifact@v4
      with:
        name: wheel-ubuntu-latest
        path: dist/

    - name: Install tooling
      run: python -m pip install --upgrade pip twine

    - name: Check wheel with twine
      run: twine check dist/*.whl

    - name: Verify compiled extension
      run: |
        python -m pip install dist/*.whl
        python -c "
        import dsf, inspect
        f = inspect.getfile(dsf)
        print('Module location:', f)
        assert f.endswith(('.so', '.pyd', '.dll')), 'Expected a compiled extension'
        print('SUCCESS: compiled binary extension confirmed')
        "

    - name: Check stub file
      run: |
        python -c "
        import os
        if os.path.exists('dsf.pyi'):
            content = open('dsf.pyi').read().strip()
            print('Stub file OK' if content else 'Warning: stub file is empty')
        else:
            print('No stub file found')
        "